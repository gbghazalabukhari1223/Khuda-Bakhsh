name: Build KB Jarvis OS v14

on:
  push:
    branches:
      - kb-jarvis-os-v11
    paths:
      - 'kb-jarvis-os/**'
      - '.github/workflows/kb-jarvis-os-v11.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'kb-jarvis-os/**'
      - '.github/workflows/kb-jarvis-os-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate Browser Companion JavaScript and manifest
        shell: pwsh
        run: |
          node --check kb-jarvis-os/browser-companion/service-worker.js
          node --check kb-jarvis-os/browser-companion/page-agent.js
          node --check kb-jarvis-os/browser-companion/popup.js
          $manifest = Get-Content kb-jarvis-os/browser-companion/manifest.json -Raw | ConvertFrom-Json
          if ([version]$manifest.version -lt [version]'14.0.0') { throw "Unexpected Browser Companion version: $($manifest.version)" }

      - name: Restore
        run: dotnet restore kb-jarvis-os/src/KB.Jarvis.App/KB.Jarvis.App.csproj

      - name: Build and capture concise diagnostics
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/diagnostics | Out-Null
          dotnet build kb-jarvis-os/src/KB.Jarvis.App/KB.Jarvis.App.csproj --configuration Release --no-restore --nologo '-clp:ErrorsOnly;NoSummary' 2>&1 | Tee-Object artifacts/diagnostics/build.log
          if ($LASTEXITCODE -ne 0) {
            'failed' | Set-Content artifacts/diagnostics/build-status.txt
            exit 1
          }
          'success' | Set-Content artifacts/diagnostics/build-status.txt

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KB-Jarvis-OS-v14-Compiler-Diagnostics
          path: artifacts/diagnostics/
          if-no-files-found: error
          retention-days: 30

      - name: Stop after compiler failure
        if: steps.build.outcome != 'success'
        shell: pwsh
        run: throw 'The KB Jarvis OS 14 native Windows build failed.'

      - name: Publish self-contained native Windows EXE
        run: dotnet publish kb-jarvis-os/src/KB.Jarvis.App/KB.Jarvis.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/KB-Jarvis-OS-v14

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = 'artifacts/KB-Jarvis-OS-v14/KB_Jarvis_OS.exe'
          if (-not (Test-Path $exe)) { throw "Published executable not found: $exe" }
          $item = Get-Item $exe
          if ($item.Length -lt 1000000) { throw "Published executable is unexpectedly small." }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          @(
            'KB Jarvis OS 14.0.0',
            'Bounded priority audio and latest-frame visual streaming',
            'Verified folder creation, file organization, move and copy workflows',
            'Custom HTML CSS JavaScript and PHP Website Studio with backups',
            'YouTube search and playback verification',
            'Existing-session WordPress page and post draft or publish workflow',
            'Existing-session WhatsApp verified messaging',
            'Developer: KB (Khuda Bakhsh)',
            "Built: $(Get-Date -Format o)",
            "SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash)"
          ) | Set-Content 'artifacts/KB-Jarvis-OS-v14/BUILD_INFO.txt'

      - name: Include Browser Companion and acceptance docs
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force kb-jarvis-os/browser-companion artifacts/KB-Jarvis-OS-v14/BrowserCompanion
          Copy-Item kb-jarvis-os/README.md artifacts/KB-Jarvis-OS-v14/README.md
          Copy-Item kb-jarvis-os/ACCEPTANCE_TESTS.md artifacts/KB-Jarvis-OS-v14/ACCEPTANCE_TESTS.md

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KB-Jarvis-OS-v14-Windows-x64
          path: artifacts/KB-Jarvis-OS-v14/
          if-no-files-found: error
          retention-days: 30

  report-build-errors:
    needs: build-windows
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Download compiler diagnostics
        uses: actions/download-artifact@v4
        with:
          name: KB-Jarvis-OS-v14-Compiler-Diagnostics
          path: diagnostics
      - name: Print exact compiler errors
        run: |
          echo '===== EXACT KB JARVIS V14 COMPILER ERRORS ====='
          cat diagnostics/build.log
          echo '===== END COMPILER ERRORS ====='