<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KB Jarvis OS Companion</title>
  <style>
    body{width:350px;margin:0;padding:18px;background:radial-gradient(circle at 50% 0,#173445,#05090e 62%);color:#e8fbff;font:13px system-ui;border:1px solid #2c8da4}
    h1{font-size:17px;margin:0 0 4px;color:#69eeff;letter-spacing:.08em}.muted{color:#91b5c1;font-size:11px;line-height:1.5}
    .persona{margin-top:8px;color:#e9b9ff;font-size:11px}.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:13px 0}.chip{border:1px solid #2e687b;border-radius:6px;padding:6px;background:#0b1720;color:#b5fbff;font-size:10px;text-align:center}
    .status{margin:12px 0;padding:12px;border:1px solid #2d6d81;background:#0b141d;border-radius:8px}.online{color:#62ff95}.offline{color:#ff6d83}button{width:100%;padding:10px;background:#152733;color:#ecfbff;border:1px solid #43c6df;border-radius:6px;cursor:pointer}
  </style>
</head>
<body>
  <h1>KB JARVIS OS 15</h1>
  <div class="muted">Female Executive Browser Companion · Developer: KB (Khuda Bakhsh)</div>
  <div class="persona">Existing signed-in sessions · verified browser execution</div>
  <div class="chips"><div class="chip">WHATSAPP</div><div class="chip">YOUTUBE</div><div class="chip">WORDPRESS</div><div class="chip">CHATGPT READ</div></div>
  <div class="status"><strong id="state">Checking…</strong><div id="detail" class="muted"></div></div>
  <button id="reconnect">Reconnect to Jarvis 15</button>
  <script src="popup.js"></script>
</body>
</html>
