<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KB Jarvis OS Companion</title>
  <style>
    body{width:340px;margin:0;padding:18px;background:radial-gradient(circle at 50% 0,#102d3c,#05090e 62%);color:#e8fbff;font:13px system-ui;border:1px solid #20758a}
    h1{font-size:17px;margin:0 0 4px;color:#52e8ff;letter-spacing:.08em}.muted{color:#86aab7;font-size:11px;line-height:1.5}
    .chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:13px 0}.chip{border:1px solid #285c6e;border-radius:6px;padding:6px;background:#0b1720;color:#a8f8ff;font-size:10px;text-align:center}
    .status{margin:12px 0;padding:12px;border:1px solid #285f72;background:#0b141d;border-radius:8px}.online{color:#62ff95}.offline{color:#ff5b70}button{width:100%;padding:10px;background:#13232f;color:#ecfbff;border:1px solid #32a3bd;border-radius:6px;cursor:pointer}
  </style>
</head>
<body>
  <h1>KB JARVIS OS 14</h1>
  <div class="muted">High-speed Browser Companion · Developer: KB (Khuda Bakhsh)</div>
  <div class="chips"><div class="chip">WHATSAPP</div><div class="chip">YOUTUBE</div><div class="chip">WORDPRESS</div><div class="chip">CHATGPT READ</div></div>
  <div class="status"><strong id="state">Checking…</strong><div id="detail" class="muted"></div></div>
  <button id="reconnect">Reconnect to native work core</button>
  <script src="popup.js"></script>
</body>
</html>
